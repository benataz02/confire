# SAP B1 field labels, by Service Layer property name (metadata.ts localizeConstraints). These win
# over the labels B1's $metadata carries: those are in the agent's SAP user's language, and a Service
# Layer before 10.0 FP2608 sends none. A field missing here falls back to SAP's label, then to its
# property name. Add the fields a feature declares; a UDF is the tenant's own and stays SAP's.

