# Dev:  docker compose up -d db          (just Postgres; run server/web with bun)
# Prod: docker compose --profile full up  (Postgres + both processes + Caddy + backup); the server's
#       .env sets COMPOSE_PROFILES=full so plain `docker compose …` means that. DEPLOY.md is the runbook,
#       deploy/update.sh ships a new version.
#
# A real domain is .env only, no code change and no rebuild:
#   DOMAIN=confire.ai                 staff app and sign-in on app.confire.ai, the customer portal on
#                                     portal.confire.ai, a workspace at /<slug>/ on each; one session
#                                     cookie on confire.ai (apps/server/src/tenant.ts)
#   BETTER_AUTH_SECRET=...            openssl rand -base64 32
#   POSTGRES_PASSWORD=...             openssl rand -hex 32 (set before the volume is first created)
#   RESEND_API_KEY=re_...             a sending_access key; unset = mail is printed to the server log
# DNS: A records for app and portal (and the apex, which redirects to sign-in). Every *.<DOMAIN>
# host receives the session cookie: never point a name at a service you don't control.
# Resend: verify mail.<DOMAIN> (SPF, DKIM, MX for the return path). Its region is fixed when the
# domain is added, so pick EU vs US first.
# Backups (service `backup`): R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY; optional
# BACKUP_AT (UTC, default 02:00) and BACKUP_PING_URL.
# OAuth consoles: one redirect URI per provider, https://app.<DOMAIN>/api/auth/callback/{google,microsoft}.
# Microsoft: emit the optional `xms_edov` claim (a Microsoft email counts as verified only on it).
services:
  db:
    image: postgres:17
    # A VPS reboot or a crash brings the stack back; `docker compose stop` still stops it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: confire
      # From .env in production (`openssl rand -hex 32`: hex, because it goes into DATABASE_URL below
      # unescaped). Read once, when the volume is first initialised — changing it later needs ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confire}
      POSTGRES_DB: confire
    # Loopback only: the dev server reaches it on localhost, the prod server over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confire"]
      interval: 5s
      timeout: 3s
      retries: 10

  server: &app
    # Built only by CI (.github/workflows/deploy.yml, apps/server/Dockerfile) and pulled by
    # deploy/update.sh: the 2 GB server can OOM on the two UI5 builds. No `build:` on purpose — with
    # one, a failed pull silently falls back to building here. CONFIRE_TAG=<sha> in .env pins a version.
    image: ghcr.io/benataz02/confire:${CONFIRE_TAG:-latest}
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: postgres://confire:${POSTGRES_PASSWORD:-confire}@db:5432/confire
      # Fail fast: a placeholder here would sign cookies AND (crypto.ts) encrypt SAP secrets with a
      # string that is in git. Better Auth only rejects its own default secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      # Every URL, the cookie's domain and the mail domain derive from it (tenant.ts). No default: unset
      # is dev's localhost, so a forgotten DOMAIN breaks the deploy instead of putting the session
      # cookie on a name this stack does not own. Not `:?` — compose checks that for every service, so
      # it would refuse even the dev `up -d db`.
      DOMAIN: ${DOMAIN:-}
      # Mail (apps/server/src/mail): sender notify@mail.<DOMAIN>. No key = the console mailer. The
      # admin key is only for tenant sender domains (Settings → Portal); unset turns them off.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_ADMIN_KEY: ${RESEND_ADMIN_KEY:-}
      # Rows per Service Layer page (apps/server/src/lookups.ts); unset = 100.
      B1_PAGE_SIZE: ${B1_PAGE_SIZE:-}
      # Unset leaves that sign-in button dead: Better Auth only logs a warning at boot.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # Loopback only: Caddy is the public door, and a public :3000 would serve plain HTTP.
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["full"]

  # The customer portal (spec §3): the same image, a second process with its own event loop, on :3001.
  portal:
    <<: *app
    command: ["bun", "run", "--cwd", "apps/server", "start:portal"]
    ports:
      - "127.0.0.1:3001:3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - server
      - portal
    profiles: ["full"]

  # Nightly pg_dump to Cloudflare R2 (deploy/backup.sh). Unset R2_* = it exits with the name of the
  # missing one, and compose's restart shows that in `docker compose ps`.
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-confire}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_AT: ${BACKUP_AT:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
  caddy_data:
