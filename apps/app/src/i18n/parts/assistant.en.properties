ASSISTANT_AUTO_SUB=Let users switch the assistant to write to SAP without asking
ASSISTANT_AUTO_INFO=Off, every create, change or copy the assistant makes is a proposal a user posts with a click. On, each user may switch auto on for themselves beside the chat box. A write still asks in a chat holding a client''s files, and for a copy to an invoice.
