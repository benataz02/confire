ASSISTANT_MCP_SUB=Let users connect their own Claude or ChatGPT to this workspace
ASSISTANT_MCP_INFO=On, each user may connect their own AI subscription (Claude, ChatGPT) to Confire. It signs in as that user and works on configurations and SAP records with that user''s rights, on their own tokens. Confire data goes to that user''s AI provider. Every SAP write asks the user to confirm in their AI before it is posted.
