# Notifications, staff side (notifications spec §4): per catalog type its label (NOTIF_<ID>, the id
# upper-cased with . -> _), a one-line description, and the bell's title. A title's placeholders:
# {0} who acted, {1} the project, {2} the client's company, {3} the quotation number.
NOTIF_PAGE_INTRO=Choose what you hear about, on the bell and by email. A request nobody holds yet reaches everyone who has its event switched on; once someone holds it, only they hear of it. Account emails (sign-in, password, invitations) always arrive.
NOTIF_MENU=Notifications

NOTIF_REQUEST_SUBMITTED=New request
NOTIF_REQUEST_SUBMITTED_DESC=A client submits a new request
NOTIF_REQUEST_SUBMITTED_TITLE={0} ({2}) submitted a request
NOTIF_REQUEST_ASSIGNED=Assigned to you
NOTIF_REQUEST_ASSIGNED_DESC=A colleague hands a request to you
NOTIF_REQUEST_ASSIGNED_TITLE={0} assigned a request to you
NOTIF_REQUEST_RESUBMITTED=Request resubmitted
NOTIF_REQUEST_RESUBMITTED_DESC=A client resubmits a request you hold, with the changes made
NOTIF_REQUEST_RESUBMITTED_TITLE={0} ({2}) resubmitted a request
NOTIF_REQUEST_COMMENT=Client message
NOTIF_REQUEST_COMMENT_DESC=A client writes a message on a request you hold
NOTIF_REQUEST_COMMENT_TITLE={0} ({2}) commented
NOTIF_REQUEST_FILE=Client file
NOTIF_REQUEST_FILE_DESC=A client adds a file to a request you hold
NOTIF_REQUEST_FILE_TITLE={0} ({2}) added a file
NOTIF_REQUEST_QUOTE_ACCEPTED=Quotation accepted
NOTIF_REQUEST_QUOTE_ACCEPTED_DESC=A client accepts the quotation on a request you hold
