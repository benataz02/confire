<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer portal</title>
    <link rel="icon" type="image/png" href="/confire-logo.png" />
    <!-- The page's colour until React draws it: Horizon's --sapShellColor, Morning or Evening by the OS —
         the sign-in frame's background, so the step from confire.ai shows no white or grey frame. Fixed
         values on purpose: UI5 boots in Morning before main.tsx sets the real theme (appearance.ts), and a
         var() here would paint that interim Morning. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html { background: #fff; }
      @media (prefers-color-scheme: dark) { html { background: #1d232a; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
