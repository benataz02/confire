# Notifications, client side (notifications spec §4): per catalog type its label (NOTIF_<ID>, the id
# upper-cased with . -> _), a one-line description, and the bell's title. A title's placeholders:
# {0} who acted, {1} the project, {2} the company, {3} the quotation number.
